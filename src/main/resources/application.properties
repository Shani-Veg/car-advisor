spring.application.name=car-advisor

# Folder with rules.json, catalog.csv, occupations.csv and the tax-authority use-value file.
# For a pilot: point this at Strauss's real files. No code change needed.
advisor.data-dir=data

# Chat agent. Available only when GEMINI_API_KEY is set in the environment; otherwise the form keeps working alone.
# Models are tried in order: a busy model falls through to the next one.
advisor.assistant.enabled=true
advisor.gemini.api-key=${GEMINI_API_KEY:}
advisor.gemini.models=gemini-3.5-flash-lite,gemini-flash-lite-latest
advisor.gemini.timeout-seconds=40

# live = Gemini answers. replay = play back turns recorded from a real run (no network, no key); the API declares it
# as assistantMode=REPLAY. record-file: while live, append every model turn there (off when empty).
advisor.llm.mode=live
advisor.llm.replay-file=demo/recorded-turns.jsonl
advisor.llm.record-file=

# Local file database: cases survive a page refresh and a server restart. A pilot would use PostgreSQL.
spring.datasource.url=jdbc:h2:file:./db/car-advisor
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
