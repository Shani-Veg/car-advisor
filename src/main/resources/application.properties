spring.application.name=car-advisor

# Folder with rules.json, catalog.csv, occupations.csv and the tax-authority use-value file.
# For a pilot: point this at Strauss's real files. No code change needed.
advisor.data-dir=data

# Chat agent. Available only when GEMINI_API_KEY is set in the environment; otherwise the form keeps working alone.
# Models are tried in order: a busy model falls through to the next one.
advisor.assistant.enabled=true
advisor.gemini.api-key=${GEMINI_API_KEY:}
advisor.gemini.models=gemini-3.5-flash-lite,gemini-flash-lite-latest
advisor.gemini.timeout-seconds=20
# The first model gets this long before the next model is tried (Gemini sometimes stalls for 10-15 s;
# normal answers take 1-4 s).
advisor.gemini.first-try-seconds=6
# When every model answers 429/5xx: wait (800 ms, then 1.6 s, plus jitter; never over 4 s) and try again, at most twice.
# A quota that frees up only later is not waited for: the chat says the assistant is busy and the form keeps working.
advisor.gemini.busy-retries=2
advisor.gemini.backoff-ms=800

# Payslip reading sends the file to the model. Turn it off where there is no processing agreement with the provider.
advisor.payslip.enabled=true

# Public demo (the Hugging Face Space): the employee screen asks for made-up details only and links the sample payslip.
advisor.public-demo=false

# live = Gemini answers. replay = play back turns recorded from a real run (no network, no key); the API declares it
# as assistantMode=REPLAY. record-file: while live, append every model turn there (off when empty).
advisor.llm.mode=live
advisor.llm.replay-file=demo/recorded-turns.jsonl
advisor.llm.record-file=

# Local file database: cases survive a page refresh and a server restart.
# In the cloud the disk is wiped on every restart, so set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD to a
# PostgreSQL database (e.g. jdbc:postgresql://host/db?sslmode=require); environment variables override these lines.
spring.datasource.url=jdbc:h2:file:./db/car-advisor
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# On Render (RENDER_EXTERNAL_URL is set there), the server visits its own home page every 10 minutes so the free plan
# never sleeps. See config/KeepAwake.

# Payslip upload: read in memory, never saved. The reader itself also refuses files over 5MB.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
