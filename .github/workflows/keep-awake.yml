# Keeps the public demo awake: Render's free plan sleeps after 15 minutes without visits,
# and the first visit after that waits about a minute.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the live site
        run: curl --silent --show-error --fail --max-time 180 --retry 2 --output /dev/null --write-out "%{http_code} in %{time_total}s\n" https://car-advisor-dqeg.onrender.com/
