# Render Blueprint: the public demo. New -> Blueprint -> this repo. Render asks for the two secrets on creation.
services:
  - type: web
    name: car-advisor
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADVISOR_REP_PASSWORD
        sync: false
      # Permanent storage (PostgreSQL, e.g. Neon). Without these the demo database is wiped on every restart.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
